spring:
  application:
    name: sentinel-aml

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel_aml}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin123}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# AML Rule configuration — tunable without code redeployment
aml:
  rules:
    ctr-threshold-inr: 833000         # ~$10,000 USD at approx 83.3 INR/USD
    structuring:
      min-amount-inr: 749700          # ~$9,000
      max-amount-inr: 832999          # ~$9,999
      count-threshold: 3
      window-hours: 24
    rapid-movement:
      outflow-percent-threshold: 80
      window-hours: 48
    behavioral-deviation:
      rolling-days: 90
      multiplier-threshold: 3.0

logging:
  level:
    com.sentinel.aml: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
